<svg xmlns="http://www.w3.org/2000/svg" width="1366" height="900" viewBox="0 0 1366 900" role="img" aria-labelledby="title desc">
  <title id="title">Thiết kế đề xuất — Báo cáo và thống kê bệnh viện</title>
  <desc id="desc">Bản thiết kế tĩnh, chưa phải giao diện WPF đã triển khai. Các dấu gạch ngang là dữ liệu chưa tải. Danh mục bên trái có sáu nhóm và hai mươi chuyên đề.</desc>
  <defs>
    <style>
      text {font-family:'Segoe UI',Arial,sans-serif;fill:#21344B;font-size:14px}
      .muted {fill:#586D85;font-size:13px}
      .small {fill:#586D85;font-size:12px}
      .heading {font-size:25px;font-weight:600;fill:#102F54}
      .section {font-size:16px;font-weight:600;fill:#102F54}
      .label {font-size:13px;font-weight:600}
      .panel {fill:white;stroke:#D9E2ED}
      .line {stroke:#E5EBF2;stroke-width:1}
      .icon {fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
    </style>
    <g id="chevron"><path d="M0 0l4 4-4 4" fill="none" stroke="#586D85" stroke-width="1.5" stroke-linecap="round"/></g>
    <g id="document"><path d="M3 1h9l5 5v15H3z M12 1v6h5 M7 11h6 M7 15h6" class="icon"/></g>
  </defs>
  <rect width="1366" height="900" fill="#F3F6FA"/>
  <rect width="1366" height="64" fill="white"/>
  <path d="M0 64H1366" class="line"/>
  <rect x="24" y="13" width="153" height="38" rx="7" class="panel"/>
  <path d="M40 32l8-7 8 7 M43 30v12h10V30 M47 42v-7h3v7" stroke="#2468CD" fill="none" stroke-width="1.6"/>
  <text x="66" y="37" class="label">Màn hình chính</text>
  <text x="201" y="38" class="section">Báo cáo và thống kê</text>
  <text x="1162" y="37" class="muted">Nội bộ bệnh viện</text>
  <circle cx="1320" cy="32" r="17" fill="#EAF2FF"/>
  <path d="M1314 42v-2c0-7 12-7 12 0v2 M1320 24a4 4 0 1 0 0 8a4 4 0 1 0 0-8" fill="none" stroke="#2468CD" stroke-width="1.6"/>

  <!-- Danh mục cuộn độc lập; hình thể hiện nhóm Khám chữa bệnh đang mở. -->
  <rect x="24" y="88" width="248" height="760" rx="12" class="panel"/>
  <text x="44" y="119" class="section">Danh mục báo cáo</text>
  <text x="44" y="141" class="muted">6 nhóm · 20 chuyên đề</text>
  <rect x="40" y="159" width="216" height="39" rx="6" fill="#F7F9FC" stroke="#D9E2ED"/>
  <circle cx="56" cy="176" r="5" fill="none" stroke="#586D85" stroke-width="1.5"/>
  <path d="M60 180l4 4" stroke="#586D85" stroke-width="1.5"/>
  <text x="75" y="184" class="muted">Tìm tên báo cáo…</text>

  <text x="44" y="229" class="label">Tổng hợp</text>
  <text x="235" y="229" class="small">1</text>
  <rect x="36" y="242" width="224" height="42" rx="7" fill="#EAF2FF"/>
  <path d="M50 267v-7 M56 267v-12 M62 267v-17" fill="none" stroke="#2468CD" stroke-width="2"/>
  <text x="76" y="268" style="fill:#1D5AAC;font-weight:600">Tổng quan bệnh viện</text>

  <text x="44" y="316" class="label">Khám chữa bệnh</text>
  <text x="219" y="316" class="small">7</text>
  <path d="M239 309l4 4 4-4" fill="none" stroke="#586D85" stroke-width="1.5"/>
  <text x="54" y="352">Hồ sơ bệnh nhân</text>
  <text x="54" y="391">Tiếp nhận và phiếu khám</text>
  <text x="54" y="430">Lịch khám và điều phối</text>
  <text x="54" y="469">Khám và điều trị</text>
  <text x="54" y="508">Kế hoạch điều trị</text>
  <text x="54" y="547">Dịch vụ thực hiện</text>
  <text x="54" y="586">Đơn thuốc</text>
  <path d="M40 605H256" class="line"/>
  <text x="44" y="636" class="label">Tài chính</text><text x="219" y="636" class="small">3</text><use href="#chevron" x="241" y="628"/>
  <text x="44" y="683" class="label">Kho và vật tư</text><text x="219" y="683" class="small">4</text><use href="#chevron" x="241" y="675"/>
  <text x="44" y="730" class="label">Nhân sự và vận hành</text><text x="219" y="730" class="small">4</text><use href="#chevron" x="241" y="722"/>
  <text x="44" y="777" class="label">Hệ thống</text><text x="219" y="777" class="small">1</text><use href="#chevron" x="241" y="769"/>
  <path d="M40 797H256" class="line"/>
  <text x="44" y="825" class="small">Chỉ hiển thị báo cáo được cấp quyền</text>

  <!-- Vùng làm việc; tiêu đề và hành động luôn ở trên cùng. -->
  <text x="296" y="117" class="heading">Tổng quan bệnh viện</text>
  <text x="296" y="143" class="muted">Theo dõi lịch hẹn, lượt khám xác nhận và mức độ hoàn tất trong kỳ.</text>
  <rect x="1166" y="94" width="176" height="42" rx="7" fill="#EDF0F4" stroke="#D9E2ED"/>
  <path d="M1185 106v12 M1181 114l4 4 4-4 M1179 121h12" fill="none" stroke="#66768A" stroke-width="1.6"/>
  <text x="1201" y="120" style="fill:#66768A;font-weight:600;font-size:13px">Xuất báo cáo này</text>

  <rect x="296" y="165" width="1046" height="116" rx="12" class="panel"/>
  <text x="314" y="190" class="label">Khoảng báo cáo</text>
  <rect x="465" y="177" width="73" height="28" rx="5" fill="#EAF2FF"/>
  <text x="480" y="196" style="fill:#1D5AAC;font-size:12px;font-weight:600">Tháng này</text>
  <text x="553" y="196" class="small">Hôm nay</text><text x="625" y="196" class="small">7 ngày qua</text>
  <text x="314" y="225" class="small">Từ ngày</text><text x="491" y="225" class="small">Đến ngày</text><text x="668" y="225" class="small">Nhóm số liệu theo</text>
  <rect x="314" y="235" width="161" height="34" rx="6" class="panel"/>
  <text x="326" y="257" style="font-size:13px">01/10/2026</text><path d="M452 245h11v13h-11z M452 249h11 M455 242v6 M460 242v6" fill="none" stroke="#586D85" stroke-width="1.3"/>
  <rect x="491" y="235" width="161" height="34" rx="6" class="panel"/>
  <text x="503" y="257" style="font-size:13px">20/10/2026</text><path d="M629 245h11v13h-11z M629 249h11 M632 242v6 M637 242v6" fill="none" stroke="#586D85" stroke-width="1.3"/>
  <rect x="668" y="235" width="137" height="34" rx="6" class="panel"/><text x="680" y="257" style="font-size:13px">Ngày</text><path d="M784 249l4 4 4-4" fill="none" stroke="#586D85" stroke-width="1.5"/>
  <rect x="821" y="229" width="138" height="40" rx="7" fill="#2468CD"/><text x="842" y="254" style="fill:white;font-weight:600;font-size:13px">Tải báo cáo</text>
  <text x="979" y="253" class="small">Chỉ tính trong khoảng đã chọn</text>

  <rect x="296" y="297" width="1046" height="37" rx="6" fill="#EAF2FF"/>
  <circle cx="315" cy="315" r="7" fill="none" stroke="#1D5AAC" stroke-width="1.3"/><text x="313" y="319" style="font-size:11px;fill:#1D5AAC;font-weight:600">i</text>
  <text x="333" y="320" style="fill:#1D5AAC;font-size:13px">Chưa tải báo cáo. Chọn khoảng thời gian, sau đó nhấn “Tải báo cáo” để xem số liệu.</text>

  <!-- KPI: nền trắng, màu nhấn chỉ dùng cho giá trị. Không tạo số liệu minh họa. -->
  <rect x="296" y="350" width="1046" height="109" rx="12" class="panel"/>
  <path d="M558 369v71 M819 369v71 M1080 369v71" class="line"/>
  <text x="316" y="377" class="label">Tổng lịch hẹn</text><text x="316" y="414" style="font-size:29px;fill:#2468CD;font-weight:600">—</text><text x="352" y="413" class="muted">lịch</text><text x="316" y="440" class="small">Theo ngày giờ khám</text>
  <text x="578" y="377" class="label">Lượt khám xác nhận</text><text x="578" y="414" style="font-size:29px;fill:#087A73;font-weight:600">—</text><text x="614" y="413" class="muted">lượt</text><text x="578" y="440" class="small">Theo thời gian khám</text>
  <text x="839" y="377" class="label">Lịch đã khám</text><text x="839" y="414" style="font-size:29px;fill:#76519E;font-weight:600">—</text><text x="875" y="413" class="muted">lịch</text><text x="839" y="440" class="small">Thuộc tập lịch trong kỳ</text>
  <text x="1100" y="377" class="label">Tỷ lệ lịch đã khám</text><text x="1100" y="414" style="font-size:29px;fill:#986010;font-weight:600">—</text><text x="1136" y="413" class="muted">%</text><text x="1100" y="440" class="small">Lịch đã khám / tổng lịch hẹn</text>

  <rect x="296" y="475" width="638" height="217" rx="12" class="panel"/>
  <text x="316" y="504" class="section">Xu hướng hoạt động</text>
  <circle cx="701" cy="499" r="4" fill="#2468CD"/><text x="711" y="504" class="small">Lịch hẹn</text><circle cx="796" cy="499" r="4" fill="#087A73"/><text x="806" y="504" class="small">Khám xác nhận</text>
  <path d="M328 533H908 M328 568H908 M328 603H908 M328 638H908" class="line"/>
  <rect x="445" y="562" width="340" height="49" rx="5" fill="white"/>
  <text x="615" y="583" text-anchor="middle" class="label">Biểu đồ sẽ hiển thị sau khi tải</text>
  <text x="615" y="605" text-anchor="middle" class="small">Nhóm theo ngày · Không hiển thị số liệu giả định</text>
  <text x="615" y="671" text-anchor="middle" class="small">Kỳ báo cáo</text>

  <rect x="950" y="475" width="392" height="217" rx="12" class="panel"/>
  <text x="970" y="504" class="section">Trạng thái lịch hẹn</text>
  <text x="970" y="526" class="small">Số lịch trong khoảng đã chọn</text>
  <text x="970" y="561" class="muted">Chờ khám</text><path d="M1075 556H1285" stroke="#E8EEF5" stroke-width="8"/><text x="1309" y="561" class="muted">—</text>
  <text x="970" y="602" class="muted">Đã khám</text><path d="M1075 597H1285" stroke="#E8EEF5" stroke-width="8"/><text x="1309" y="602" class="muted">—</text>
  <text x="970" y="643" class="muted">Đã hủy</text><path d="M1075 638H1285" stroke="#E8EEF5" stroke-width="8"/><text x="1309" y="643" class="muted">—</text>
  <text x="970" y="674" class="small">Chú giải có nhãn chữ, không chỉ dựa vào màu.</text>

  <rect x="296" y="708" width="1046" height="140" rx="12" class="panel"/>
  <text x="316" y="736" class="section">Bảng đối chiếu theo kỳ</text><text x="1128" y="735" class="small">Chọn kỳ để xem bản ghi nguồn</text>
  <rect x="297" y="748" width="1044" height="37" fill="#F7F9FC"/>
  <text x="316" y="772" class="label">Ngày</text><text x="635" y="772" class="label">Lịch hẹn</text><text x="820" y="772" class="label">Khám xác nhận</text><text x="1038" y="772" class="label">Lịch đã khám</text><text x="1220" y="772" class="label">Tỷ lệ (%)</text>
  <text x="819" y="818" text-anchor="middle" class="muted">Chưa có kết quả báo cáo để đối chiếu hoặc xuất tệp.</text>
  <text x="24" y="877" class="small">BẢN THIẾT KẾ TĨNH · Đề xuất bố cục, chưa triển khai vào WPF · “—” biểu thị dữ liệu chưa tải</text>
  <text x="1342" y="877" text-anchor="end" class="small">Bố cục chuẩn 1366 px · Nội dung cuộn độc lập</text>
</svg>
